<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="zmGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9500" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>

  <!-- Speed Motion Lines behind cart -->
  <line x1="16" y1="36" x2="48" y2="36" stroke="#EA580C" stroke-width="4.5" stroke-linecap="round" />
  <line x1="8" y1="50" x2="52" y2="50" stroke="#EA580C" stroke-width="4.5" stroke-linecap="round" />
  <line x1="20" y1="64" x2="56" y2="64" stroke="#EA580C" stroke-width="4.5" stroke-linecap="round" />

  <!-- Shopping Cart Handle and Chassis -->
  <path d="M 44 26 L 60 26 C 63 26 66 28 67 31 L 82 72 C 83 75 86 77 90 77 L 138 77 C 142 77 145 74 146 70 L 152 46" 
        fill="none" stroke="#0F172A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- The stylized 'Z' inside cart -->
  <path d="M 68 28 L 140 28 C 145 28 147 34 143 38 L 98 67 L 140 67 C 144 67 146 71 144 74 L 142 77 L 76 77 C 72 77 70 71 74 67 L 118 38 L 74 38 C 70 38 68 34 68 28 Z" 
        fill="url(#zmGradDark)" />

  <!-- Cart Wheels -->
  <circle cx="88" cy="94" r="9" fill="#0F172A" stroke="#0F172A" stroke-width="2" />
  <circle cx="88" cy="94" r="4" fill="#FFFFFF" />
  <circle cx="128" cy="94" r="9" fill="#0F172A" stroke="#0F172A" stroke-width="2" />
  <circle cx="128" cy="94" r="4" fill="#FFFFFF" />

  <!-- ZentroMart Wordmark -->
  <g transform="translate(170, 74)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, Roboto, sans-serif" 
          font-size="52" font-weight="900" fill="#0F172A" letter-spacing="-1">Zentro</text>
    <text x="175" y="0" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, Roboto, sans-serif" 
          font-size="52" font-weight="900" fill="url(#zmGradDark)" letter-spacing="-1">Mart</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(174, 98)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Inter, Roboto, sans-serif" 
          font-size="14.5" font-weight="700" fill="#475569" letter-spacing="4">ALL THINGS • ONE PLACE</text>
  </g>
</svg>
